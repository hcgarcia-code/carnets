[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphify"
version = "0.1.0"
description = "Installation and setup tool for carnets project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
graphify = "graphify.cli:main"

[tool.setuptools]
packages = ["graphify"]

[tool.bandit]
exclude_dirs = ["venv", "tests", "sistema_carnets/gestion/migrations", "staticfiles"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "sistema_carnets/gestion/migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "S", "B"]
ignore = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["sistema_carnets"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "sistema_carnets.settings"

[tool.bandit]
exclude_dirs = ["venv", "tests", "sistema_carnets/gestion/migrations", "staticfiles"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "sistema_carnets/gestion/migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "S", "B"]
ignore = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["sistema_carnets"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "sistema_carnets.settings"

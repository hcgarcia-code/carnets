{% load static %}<!DOCTYPE html>
{% comment %}
Plantilla base de todas las pantallas del proyecto.

Antes cada plantilla repetía su propia cabecera y su propio bloque <style> con
el mismo CSS: ocho copias que había que recordar al cambiar un color, y de las
que siempre se olvidaba alguna. Todo eso vive ahora aquí y en carnets.css.

El admin de Django queda fuera a propósito: trae sus propias plantillas y
sobrescribir su CSS es frágil, se rompe al actualizar Django y no aporta nada
—lo usa una sola persona—.

Bloques disponibles:
  titulo     — el <title> de la pestaña
  barra      — la barra superior (por defecto: marca + enlace de ayuda)
  contenido  — obligatorio
  pie        — el pie (por defecto: solo la marca roja y negra)
{% endcomment %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Carnets — CGT{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'gestion/carnets.css' %}">
</head>
<body>

    {% comment %}
        Las formas del fondo son lo que hace visible el vidrio: sobre blanco
        plano, un panel translúcido es indistinguible del blanco. Van fijas y
        sin capturar clics (ver .fondo en carnets.css).
    {% endcomment %}
    <div class="fondo" aria-hidden="true">
        <span class="f1"></span>
        <span class="f2"></span>
        <span class="f3"></span>
        <span class="f4"></span>
    </div>

    {% block barra %}
    <nav class="barra">
        <a class="marca" href="{% url 'portada' %}">
            <img class="marca__logo" src="{% static 'gestion/logo-cgt.png' %}" alt="CGT">
            <span class="marca__sep"></span>
            <span class="marca__nombre">Sistema de carnets</span>
        </a>
        <div class="barra__acciones">
            <a href="{% url 'ayuda' %}">Ayuda</a>
            {% if user.is_authenticated %}
                <a href="{% url 'notificaciones' %}">Notificaciones</a>
                {% comment %}
                    Salir va en un formulario y no en un enlace porque cierra
                    la sesión, y eso cambia estado: por GET bastaría una
                    <img src="/salir/"> en cualquier página ajena para echar
                    al sindicato de la suya. Django 5 lo impone.
                {% endcomment %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Salir</button>
                </form>
            {% else %}
                <a class="boton boton--principal boton--compacto" href="{% url 'login' %}">Entrar</a>
            {% endif %}
        </div>
    </nav>
    {% endblock %}

    {% block contenido %}{% endblock %}

    {% comment %}
        El pie va sin texto legal a propósito. Quien entra aquí es el sindicato
        que sube los datos, no la persona afiliada: informar del Art. 13 le
        corresponde a cada sindicato ante su propia afiliación, no a esta
        pantalla. No lo repongas sin revisar antes la EIPD.
    {% endcomment %}
    {% block pie %}
    <footer class="pie">
        <span class="marcas"><i></i><i></i></span>
    </footer>
    {% endblock %}

</body>
</html>

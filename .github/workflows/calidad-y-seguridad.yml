# Ejecuta en cada push y cada pull request los tres controles que el proyecto
# ya exige (ver CLAUDE.md): pruebas, calidad y auditoría de seguridad.
#
# Estaban configurados desde el principio en pyproject.toml, pero no los
# ejecutaba nadie salvo a mano: un push podía introducir una regresión o una
# vulnerabilidad que bandit detecta y nadie se enteraba hasta la siguiente vez
# que alguien se acordase de lanzarlos.
name: Calidad y seguridad

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Si se empuja varias veces seguidas a la misma rama, cancela la ejecución
# anterior: solo interesa el resultado del último commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobaciones:
    runs-on: ubuntu-latest

    env:
      # La aplicación se niega a arrancar sin clave de cifrado (ver
      # GestionConfig.ready), así que CI necesita una. Es efímera y se genera
      # aquí mismo: no cifra ningún dato real, solo permite que Django arranque
      # y que las pruebas de cifrado tengan con qué trabajar.
      # Minimo 50 caracteres: por debajo, el paso de comprobacion de despliegue
      # falla con security.W009 y CI se queda en rojo sin que haya nada roto.
      SECRET_KEY: clave-efimera-de-integracion-continua-sin-valor-en-produccion-2026
      CARNETS_ENCRYPTION_KEYS: ci1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaA=
      DEBUG: 'False'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        # La suite completa, incluido tests/test_pentest.py, que levanta un
        # servidor real y lo ataca por HTTP. Estuvo excluido mientras 16 de sus
        # 20 pruebas fallaban; la causa era el propio arnes (un pipe sin drenar
        # que bloqueaba al servidor), no la aplicacion.
        run: pytest tests/ -q

      - name: Calidad (ruff)
        run: ruff check .

      - name: Auditoria de seguridad (bandit)
        run: bandit -r . -c pyproject.toml

      - name: Vulnerabilidades en dependencias (pip-audit)
        # bandit mira NUESTRO codigo; esto mira el de los demas, que es la mayor
        # parte de lo que se despliega. Django, pandas y openpyxl publican CVEs
        # sin que nada cambie en este repositorio: sin esta comprobacion, la
        # unica forma de enterarse es leer las listas de correo.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

      - name: Comprobacion de despliegue
        # Con la configuracion que tendria un servidor real. Verifica que no se
        # ha colado nada que impida desplegar de forma segura: HTTPS, cookies
        # con Secure, HSTS y cache compartida entre workers.
        env:
          ALLOWED_HOSTS: carnets.example.es
          SECURE_SSL_REDIRECT: 'True'
          SESSION_COOKIE_SECURE: 'True'
          CSRF_COOKIE_SECURE: 'True'
          SECURE_HSTS_SECONDS: '31536000'
          CACHE_BACKEND: django.core.cache.backends.redis.RedisCache
          CACHE_LOCATION: redis://127.0.0.1:6379/1
        run: python sistema_carnets/manage.py check --deploy --fail-level WARNING
